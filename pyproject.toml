[project]
name = "blank-app-template"
version = "0.1.0"
description = "A simple Streamlit app template."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "avanza-api>=16.2.0",
    "pandas>=2.2.0",
    "playwright>=1.50.0",
    "pybit>=5.17.0",
    "python-dotenv>=1.2.4",
    "reportlab>=4.2.0",
    "requests>=2.32.0",
    "streamlit>=1.61.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
