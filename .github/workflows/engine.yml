name: IMMENSITY AURORA Engine Validation

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: immensity-aurora-engine-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Validate core imports and P15 configuration
        run: |
          python -m compileall -q engine_live.py engine
          python -c "from engine.regime_selector import RegimeSelector; RegimeSelector.from_file('config/sesamfro_graph.json')"

      - name: Run test suite
        run: python -m pytest -q
