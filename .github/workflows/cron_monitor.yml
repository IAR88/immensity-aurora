name: IMMENSITY AURORA 24/7 Engine Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Execute Engine Scan Cycle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_SECRET: ${{ secrets.BYBIT_SECRET }}
        run: python engine_cron.py

      - name: Commit and Push Updated Logs
        run: |
          touch trade_log.csv signal_summary_log.csv
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add trade_log.csv signal_summary_log.csv
          git commit -m "Auto-update trade_log.csv & signal_summary_log.csv [skip ci]" || exit 0
          git push
          
